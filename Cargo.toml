[package]
name = "rs_order_utils"
version = "0.4.2"
edition = "2021"
authors = ["Ted"]
license = "MIT"
description = "Rust implementation of Polymarket CLOB order utilities with EIP-712 signing"
repository = "https://github.com/tdergouzi/rs-order-utils"  # Update with your actual repo URL
homepage = "https://github.com/tdergouzi/rs-order-utils"
readme = "README.md"
keywords = ["polymarket", "ethereum", "eip712", "clob", "orders"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
# Alloy core types and primitives
alloy-primitives = "1"
alloy-sol-types = "1"
alloy-signer = "1"
alloy-signer-local = "1"

# Crypto
k256 = { version = "0.13", features = ["ecdsa", "std"] }

# Random number generation
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Error handling
thiserror = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"], optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "macros", "test-util"] }
dotenv = "0.15"

# [[example]]
# name = "basic_order"
# required-features = []

[features]
default = []
async = ["tokio"]
